<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="rock-paper-scissors.js" defer></script>
  </head>
  <body>
    <header>
      <h1>Welcome to Rock, Paper, Scissors!</h1>
    </header>
    <main>
      <div id="rps-container">
        <button id="rock" class="gameButton"></button>
        <button id="paper" class="gameButton"></button>
        <button id="scissors" class="gameButton"></button>
      </div>
    </main>
    <footer>
      <div id="compare-container">
        <div id="playerChoice"></div>
        <div>
          <img
            id="vs-image"
            src="./images/vs-letters-versus-png.png"
            alt="Image that shows the letters V and S with a verticle line through them signifying the word versus."
          />
        </div>
        <div id="aiChoice"></div>
      </div>
      <div>
        <h1>The Winner Is</h1>
      </div>
    </footer>
  </body>
</html>
